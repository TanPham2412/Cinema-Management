server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Declare UTF-8 charset in Content-Type response header
    charset utf-8;
    charset_types text/html text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Hide server version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve uploaded images directly (no header check needed - static files)
    location ^~ /api/uploads/ {
        proxy_pass http://backend:8081/api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        client_max_body_size 20m;
    }

    # Proxy API requests to backend (^~ prevents regex locations from overriding this)
    location ^~ /api/ {
        # Block non-frontend access (Postman, browser URL bar, scripts)
        # Allow: XMLHttpRequest from frontend, WebSocket upgrades
        set $block_api "1";
        if ($http_x_requested_with = "XMLHttpRequest") {
            set $block_api "0";
        }
        if ($http_upgrade ~* "websocket") {
            set $block_api "0";
        }
        if ($block_api = "1") {
            return 403;
        }

        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # Limit request body size
        client_max_body_size 10m;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
