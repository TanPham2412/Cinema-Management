services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: cinema-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cinema123}
      MYSQL_DATABASE: cinema_management
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-cinema123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cinema-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cinema-network

  # Spring Boot Backend
  backend:
    build:
      context: ./cinema-management
      dockerfile: Dockerfile
    container_name: cinema-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cinema_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cinema123}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # App
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # CORS
      SPRING_WEB_CORS_ALLOWED_ORIGINS: https://plvcinema.xyz,https://www.plvcinema.xyz
      SPRING_WEBSOCKET_ALLOWED_ORIGINS: https://plvcinema.xyz,https://www.plvcinema.xyz
      # JWT
      JWT_SECRET: ${JWT_SECRET:-2e5f4c9a1b2d4e6f8a0c1e4f6a8c0e2f4a6c8e0f2a2c6e8f0a2c4e6f8a0c2e4f}
      # OAuth2 (optional - leave empty to disable Google Login)
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      # Mail
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Frontend URL (for password reset links)
      FRONTEND_URL: ${FRONTEND_URL:-https://plvcinema.xyz}
      # VNPay Configuration (Sandbox)
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-LN55WHPY}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-L69GRTDYKQMRLRR5YN5ARWYAHG3NTQRR}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-https://api.plvcinema.xyz/api/payment/vnpay/return}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      # MoMo Configuration
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-https://api.plvcinema.xyz/api/payment/momo/return}
      MOMO_NOTIFY_URL: ${MOMO_NOTIFY_URL:-https://api.plvcinema.xyz/api/payment/momo/notify}
      MOMO_FRONTEND_RESULT_URL: ${MOMO_FRONTEND_RESULT_URL:-https://plvcinema.xyz/payment/momo/result}
      # Logging
      LOGGING_LEVEL_NHom5_CINEMA_MANAGEMENT: INFO
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinema-network

  # React Frontend (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinema-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cinema-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  cinema-network:
    driver: bridge
